name: release

# On every merge to main: run the tests, build a fully static musl binary (web UI embedded) and
# publish it as a GitHub Release with an auto-incremented patch version (vMAJOR.MINOR.PATCH).
# The static binary runs on NixOS as-is, so nixie installs the release asset directly instead of
# compiling Rust on every deploy. Pull requests only run the tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Don't let two merges race on tag creation.
concurrency:
  group: ${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET: x86_64-unknown-linux-musl
  BIN: ntfy-dashboard

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so we can compute the next version.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}

      - name: Build static release binary
        run: cargo build --release --locked --target "$TARGET"

      - name: Check that the binary is static and starts
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/${BIN}"
          file "$bin"
          file "$bin" | grep -Eq 'static(-pie)? linked'
          # Demo mode needs no account; it should come up and serve the page.
          NTFY_BIND=127.0.0.1:18080 "$bin" --demo &
          pid=$!
          for _ in $(seq 1 50); do curl -fsS -o /dev/null http://127.0.0.1:18080/ && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<title>NTFY meal planner</title>'
          kill "$pid"

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            # No release yet: seed from the version in Cargo.toml.
            base="$(sed -n 's/^version *= *"\([0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' Cargo.toml | head -n1)"
            next="${base:-0.1.0}"
          else
            v="${latest#v}"
            major="${v%%.*}"; rest="${v#*.}"
            minor="${rest%%.*}"; patch="${rest#*.}"
            next="${major}.${minor}.$((patch + 1))"
          fi
          echo "tag=v${next}" >> "$GITHUB_OUTPUT"
          echo "Next release: v${next} (previous: ${latest:-none})"

      - name: Stage binary asset
        run: |
          set -euo pipefail
          asset="${BIN}-${{ steps.ver.outputs.tag }}-${TARGET}"
          cp "target/${TARGET}/release/${BIN}" "$asset"
          sha256sum "$asset" > "${asset}.sha256"
          echo "asset=$asset" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            "$asset" "${asset}.sha256" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
