<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0c0a">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Kitchen · NTFY meals</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>">
  <link rel="stylesheet" href="/kiosk.css">
</head>
<body>
  <div id="ambient" aria-hidden="true"></div>

  <header class="topbar">
    <div class="clock">
      <span id="time"></span>
      <span id="date"></span>
    </div>
    <div id="summary" class="summary"></div>
    <div id="sync" class="sync"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Views">
    <button data-view="today" class="active"><span class="icon">☀</span>Today</button>
    <button data-view="upcoming"><span class="icon">◷</span>Upcoming</button>
    <button data-view="rate"><span class="icon">★</span>Rate<span id="rate-badge" class="badge" hidden></span></button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" role="status" hidden></div>
  <div id="night" aria-hidden="true"></div>

  <script src="/common.js"></script>
  <script src="/kiosk.js"></script>
</body>
</html>
