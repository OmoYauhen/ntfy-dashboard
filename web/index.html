<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NTFY meal planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥗</text></svg>">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>NTFY meals <span id="mode" class="badge" hidden></span></h1>
    <nav class="pages"><a href="/" aria-current="page">Plan</a><a id="history-link" href="/history" hidden>History</a></nav>
    <nav id="days" aria-label="Days"></nav>
  </header>
  <main>
    <div id="day-head">
      <button id="prev" aria-label="Previous day">‹</button>
      <h2 id="day-title"></h2>
      <span id="day-kcal"></span>
      <span id="day-status"></span>
      <button id="keep-rest" class="action" hidden title="Confirm the current dish for every meal you haven't chosen yet">Keep the rest</button>
      <span class="keys"><span class="legend-past"></span>had before · <kbd>1</kbd>–<kbd>9</kbd> pick · <kbd>Enter</kbd> keep · <kbd>↑</kbd><kbd>↓</kbd> meal · <kbd>←</kbd><kbd>→</kbd> day</span>
      <button id="next" aria-label="Next day">›</button>
    </div>
    <div id="meals"></div>
    <p id="message" hidden></p>
  </main>
  <div id="zoom" hidden></div>
  <div id="toast" role="status" hidden></div>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
